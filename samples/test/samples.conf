# The samples the harness walks, one per line, whitespace-separated:
#
#   name  port  type  redirect_path  post_logout_path
#
#   name             the folder under samples/ (it holds the Dockerfile)
#   port             the port the sample listens on (PORT)
#   type             the app type to pick in Umbral: web | spa
#   redirect_path    the sample's redirect URI path, registered on the app
#   post_logout_path the sample's post-logout redirect URI path
#
# run.sh reads this file, and .github/workflows/samples.yml reads the same one
# for its matrix: one line here is one job there. Lines starting with # and
# blank lines are ignored.
aspnetcore 5000 web /signin-oidc /signout-callback-oidc
