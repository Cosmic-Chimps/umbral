# The only configuration of the sample. The build copies these two values into BuildConfig.

# Umbral's issuer URL: where /.well-known/openid-configuration lives. Plain http is
# accepted only for localhost and 127.0.0.1. For the quick-start Umbral on
# http://localhost:8080, reach it from an emulator with: adb reverse tcp:8080 tcp:8080
UMBRAL_ISSUER=http://localhost:8080

# The client id of a PUBLIC client you register in Umbral's admin UI (no secret).
# Its redirect URIs must be exactly:
#   com.cosmicchimps.umbral.sample:/callback
#   com.cosmicchimps.umbral.sample:/signout-callback
UMBRAL_CLIENT_ID=
