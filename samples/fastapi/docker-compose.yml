# The values come from your shell or from a .env file next to this one
# (.env is git-ignored at the repository root).
services:
  sample:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    environment:
      UMBRAL_ISSUER: ${UMBRAL_ISSUER:?set UMBRAL_ISSUER to your Umbral's issuer URL}
      UMBRAL_CLIENT_ID: ${UMBRAL_CLIENT_ID:?set UMBRAL_CLIENT_ID to the app's Client ID}
      UMBRAL_CLIENT_SECRET: ${UMBRAL_CLIENT_SECRET:?set UMBRAL_CLIENT_SECRET to the app's Client secret}
      PORT: ${PORT:-8000}
      # Optional: keeps sessions across restarts. Without it a random key is made at every start.
      SESSION_SECRET: ${SESSION_SECRET:-}
