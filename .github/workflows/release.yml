# Release: start it from the Actions tab (release > Run workflow > branch main >
# version X.Y.Z), or push a tag like v1.2.3. Either way this workflow
#
#   1. runs the same tests as CI, on the commit the run started from, so red
#      tests never leave a tag,
#   2. gets the changelog right, and fails, before anything is built, when there
#      is nothing under "## Unreleased" (no empty releases):
#        - Run workflow: it turns "## Unreleased" into "## X.Y.Z - <today>",
#          commits that to main as github-actions[bot], tags that commit vX.Y.Z
#          and pushes both in one atomic push. The tag therefore always contains
#          its own changelog section, and main is renamed before anything else
#          can merge. If main moved during the tests, the push is refused and
#          nothing is tagged: run it again.
#        - a pushed tag: the section is prepared in this run's own checkout and
#          recorded on main afterwards, only if main is still the tagged commit
#          (job `release`). The tag never moves.
#      A prerelease such as 1.2.0-rc.1 only gets its tag, on the tested commit,
#      and leaves the changelog alone,
#   3. builds linux/amd64 and linux/arm64 and pushes ghcr.io/<owner>/umbral:1.2.3
#      (and :latest, unless it is a prerelease),
#   4. deploys that exact image digest on the Caravana host with the action
#      Cosmic-Chimps/caravana-action, which waits for the rollout to be healthy;
#      the first time, it defines the app from deploy/caravana-app.json
#      (skipped for prereleases, and when the variable BELLA_BAXTER_PROJECT is
#      not set). The Caravana settings and token are read from Bella Baxter
#      with the job's GitHub OIDC token: no secret is stored in GitHub,
#   5. publishes the GitHub release with the changelog section as its notes
#      (it does not wait for the rollout: a failed rollout still has a
#      published image),
#   6. keeps the last 10 image versions and deletes older ones.
#
# Every job after `changelog` takes the version and the tag from that job's
# outputs, never from GITHUB_REF_NAME (which is "main" on a Run workflow), and
# checks out the tag, so it builds exactly the tagged commit.
#
# Setup (Bella Baxter, variables, the production environment): README,
# "Deploying on Caravana". The production environment's deployment rule must
# allow the tag pattern v* (a pushed tag) AND the branch main (Run workflow: the
# run's ref is refs/heads/main, so the deploy job is refused without it).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z, no v'
        required: true
        type: string

permissions:
  contents: read

# Two releases run one after the other, never at once: both would push to main,
# and the prune of one must not race the push of the next. Nothing is
# cancelled, since a half-finished rollout is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same tests as CI, on the commit the run started from: main's tip for a
  # Run workflow, the tagged commit for a tag push. They come first, so a
  # failing test leaves no tag behind. (ci.yml has no concurrency group, so
  # nothing in it can cancel this run.)
  test:
    uses: ./.github/workflows/ci.yml

  # The version, the notes and, on a Run workflow, the release itself. A release
  # (1.2.3) gets its section of CHANGELOG.md; when the commit has none,
  # "## Unreleased" is renamed in this checkout, which fails when it is empty.
  # A prerelease (1.2.3-rc.1) is never prepared: its notes say so and list what
  # is under Unreleased. The notes (and, for a pushed tag, the prepared
  # changelog) go to the release job as an artifact.
  changelog:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # a Run workflow pushes the changelog commit and the tag
    outputs:
      version: ${{ steps.ver.outputs.version }} # X.Y.Z or X.Y.Z-suffix, no v
      tag: ${{ steps.ver.outputs.tag }} # vX.Y.Z...
      prerelease: ${{ steps.ver.outputs.prerelease }} # 'true' or 'false'
    steps:
      # A Run workflow works on the commit the tests just passed on (full
      # history, to push to main and to see every tag): if main moved meanwhile,
      # the atomic push below is refused and nothing is tagged. A tag push
      # works on its own tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Decide the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main (it was run on $GITHUB_REF): the release commit and the tag are made on main."
              exit 1
            fi
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not X.Y.Z (a prerelease suffix is allowed, like 1.2.0-rc.1)."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Before anything is written: a tag that exists, here or on the remote,
      # is never reused.
      - name: Refuse a tag that already exists
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags --force -q origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "::error::The tag $TAG already exists. Pick another version, or delete the tag first (git push --delete origin $TAG, and gh release delete $TAG --yes if it has a GitHub release) and run this workflow again."
            exit 1
          fi

      - name: Notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          mkdir out
          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "Prerelease $VERSION: a version to try, not a release. Its image is published by tag only, and \`latest\` and the changelog stay as they were."
              if [ -n "$(.github/scripts/changelog.sh unreleased)" ]; then
                echo
                echo "What is on its way, from the changelog's \"Unreleased\" section:"
                echo
                .github/scripts/changelog.sh unreleased
              fi
            } > out/notes.md
          else
            .github/scripts/changelog.sh notes "$VERSION" >/dev/null 2>&1 ||
              .github/scripts/changelog.sh prepare "$VERSION"
            .github/scripts/changelog.sh notes "$VERSION" > out/notes.md
            cp CHANGELOG.md out/CHANGELOG.md
          fi
          { echo "### Release notes"; echo; cat out/notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # Run workflow only: commit the renamed changelog to main, tag that commit
      # and push both at once (atomic: if main moved meanwhile, nothing is
      # pushed and the run fails, so run it again). A prerelease only gets its
      # tag. A tag pushed with GITHUB_TOKEN does not start another workflow
      # run (GitHub suppresses it), so there is no second release: this run
      # goes on to build, deploy and publish the tag it just made.
      - name: Commit the changelog, tag and push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRERELEASE" != "true" ] && ! git diff --quiet -- CHANGELOG.md; then
            git commit -m "chore(release): $VERSION" -- CHANGELOG.md
          fi
          git tag -a "$TAG" -m "$TAG"
          if [ "$PRERELEASE" = "true" ]; then
            git push origin "refs/tags/$TAG"
          else
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi
          echo "Tagged $TAG at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out
          if-no-files-found: error

  image:
    needs: [test, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # The tag, not the ref the run started from: the tagged commit is what
      # gets built (on a Run workflow it includes the changelog commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      # GHCR names are lowercase, and a GitHub owner can have capitals.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/umbral" >> "$GITHUB_OUTPUT"

      # The runtime stage has a RUN that executes under the target
      # architecture, so the arm64 image needs QEMU. The build stage does not:
      # the Dockerfile cross-publishes it natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source (the repository) is among the labels
      # this sets. It is what links the package to the repository on GHCR.
      # `latest` only moves for a release: a version with a "-" is a prerelease.
      # Both come from the changelog job's outputs: github.ref_name is "main"
      # on a Run workflow.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.changelog.outputs.version }}
            type=raw,value=latest,enable=${{ needs.changelog.outputs.prerelease != 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [image, changelog]
    # A prerelease is published but never deployed. The repository opts in to
    # deploying by setting the variable BELLA_BAXTER_PROJECT; without it (a
    # fork, say) this job is skipped.
    if: ${{ needs.changelog.outputs.prerelease != 'true' && vars.BELLA_BAXTER_PROJECT != '' }}
    runs-on: ubuntu-latest
    # The environment's deployment rule limits it to tags v* (a pushed tag) and
    # the branch main (Run workflow: the run's ref is refs/heads/main), and Bella
    # Baxter's trust domain requires this environment name in the token. Add
    # required reviewers to approve each rollout.
    environment: production
    permissions:
      contents: read
      id-token: write # the job's OIDC token, which Bella Baxter exchanges for a key
    env:
      BELLA_BAXTER_URL: https://api.bella-baxter.io
      BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
      BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
      BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}

      # Only when the variable is set: an unset one must not become an empty
      # audience. The value goes in through env, never into the script text.
      - name: Bella Baxter audience
        if: ${{ vars.BELLA_OIDC_AUDIENCE != '' }}
        env:
          AUDIENCE: ${{ vars.BELLA_OIDC_AUDIENCE }}
        run: echo "BELLA_OIDC_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"

      # Signs in with the job's OIDC token (no stored secret) and leaves a
      # short-lived key for `bella run`.
      - uses: cosmic-chimps/bella-baxter-setup-action@cf993ff9e477ec89370abb7f166a4e48a2786693 # v0.1.1-preview.137
        with:
          version: 0.1.1-preview.137
          oidc: 'true'

      # `bella run` puts every secret of the environment in the environment of
      # the command it runs, and nowhere else. It does not mask them, so the
      # token is masked here before anything can print or write it. No -p or
      # -e: the project and environment come from the BELLA_BAXTER_* values
      # above. The step hands the Caravana settings to the action below as step
      # outputs, and builds the definition the first deploy needs from
      # deploy/caravana-app.json: the placeholders are filled on the JSON
      # string values (not on the raw text), with the digest image CI built.
      # A backup policy exists only in the app's definition (the console cannot
      # turn one on), so it is added when CARAVANA_BACKUP_SCHEDULE is set.
      - name: Settings from Bella Baxter
        id: caravana
        run: |
          # shellcheck disable=SC2016 # the single quotes are on purpose: the inner shell expands
          bella run -- bash -c '
            set -euo pipefail
            if [ -n "${CARAVANA_TOKEN:-}" ]; then echo "::add-mask::$CARAVANA_TOKEN"; fi
            if [ -z "${CARAVANA_URL:-}" ] || [ -z "${CARAVANA_TOKEN:-}" ]; then
              echo "::error::The Bella Baxter secrets CARAVANA_URL and CARAVANA_TOKEN are both required."
              exit 1
            fi
            definition=""
            if [ -n "${CARAVANA_DOMAIN:-}" ]; then
              filter=$(cat <<\JQ
                walk(if type == "string"
                     then (split("__IMAGE__") | join($image)) | (split("__DOMAIN__") | join($domain))
                     else . end)
                | if $schedule == "" then .
                  else .services[0].backup = {engine: "volume", schedule: $schedule, keep: 7}
                  end
          JQ
              )
              definition="$RUNNER_TEMP/app.json"
              jq --arg image "$IMAGE@$DIGEST" --arg domain "$CARAVANA_DOMAIN" \
                --arg schedule "${CARAVANA_BACKUP_SCHEDULE:-}" \
                "$filter" deploy/caravana-app.json > "$definition" || {
                echo "::error::deploy/caravana-app.json is missing or is not valid JSON."
                exit 1
              }
              if ! jq -e "[.. | strings | select(contains(\"__IMAGE__\") or contains(\"__DOMAIN__\"))] | length == 0" \
                "$definition" > /dev/null; then
                echo "::error::A placeholder in deploy/caravana-app.json was not filled."
                exit 1
              fi
            else
              echo "::notice::CARAVANA_DOMAIN is not set, so no definition is sent. The first deploy needs the Bella Baxter secret CARAVANA_DOMAIN, unless the app is already defined in Caravana."
            fi
            {
              echo "url=$CARAVANA_URL"
              echo "token=$CARAVANA_TOKEN"
              echo "app=${CARAVANA_APP_ID:-umbral}"
              echo "definition=$definition"
            } >> "$GITHUB_OUTPUT"'

      # Deploys the exact image CI just built, by digest, through Caravana's
      # API, and waits for the rollout to be healthy. The definition is used
      # only while the app has none; after that the app stored in Caravana is
      # the truth, so edits made in its console are kept (only the image is
      # replaced on each release). The action writes the job summary and prints
      # Caravana's warnings.
      # Pinned to the commit of the v1.1.0 tag.
      - name: Deploy on Caravana
        id: deploy
        uses: Cosmic-Chimps/caravana-action@e05c7a3e11c0f33a7d268d6ea32eaae70d12516d # v1.1.0
        with:
          url: ${{ steps.caravana.outputs.url }}
          token: ${{ steps.caravana.outputs.token }}
          app: ${{ steps.caravana.outputs.app }}
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          definition: ${{ steps.caravana.outputs.definition }}

  # Keep the last 10 versions. This waits for the rollout so that a failed one,
  # which Nomad reverts to the previous image, is never racing a deletion. It
  # also runs when the deploy was skipped (prerelease, or no Caravana), but not
  # when the deploy failed or was cancelled: then the old images stay until the
  # next good release.
  prune:
    needs: [image, deploy, changelog]
    if: ${{ always() && needs.image.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: .github/scripts/prune-images.sh

  # The GitHub release: the changelog section as its notes, plus GitHub's list of
  # commits. No assets: the image is the artifact. It needs the image but not the
  # deploy, so a failed rollout still has a published image and a release. A
  # re-run edits the notes of a release that exists instead of failing.
  release:
    needs: [image, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, push the changelog to main
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.changelog.outputs.version }}
      TAG: ${{ needs.changelog.outputs.tag }}
      PRERELEASE: ${{ needs.changelog.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changelog.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: out

      - name: Publish the release
        run: |
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file out/notes.md "${args[@]}"
          else
            gh release create "$TAG" --notes-file out/notes.md --generate-notes --verify-tag "${args[@]}"
          fi

      # A pushed tag whose changelog was prepared above: main gets the rename, so
      # the next release starts from an empty "Unreleased". Only when main is
      # still the tagged commit; otherwise its "Unreleased" may hold newer
      # entries, which a rename would wrongly claim. The release is out either
      # way, so this step warns rather than fails. The tag never moves. A Run
      # workflow skips this: it committed the rename to main before tagging.
      - name: Record the changelog on main
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            exit 0 # a prerelease leaves the changelog alone
          fi
          cp out/CHANGELOG.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            exit 0 # the tagged commit had its section already
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main has moved past $TAG, so its CHANGELOG.md still lists $VERSION's entries under \"## Unreleased\". On main, run .github/scripts/changelog.sh prepare $VERSION and keep any newer entries under Unreleased."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(changelog): release $VERSION" -- CHANGELOG.md
          if ! git push origin HEAD:main; then
            echo "::warning::Couldn't push the changelog to main. On main, run .github/scripts/changelog.sh prepare $VERSION and commit it."
          fi
