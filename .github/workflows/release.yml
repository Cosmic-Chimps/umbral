# Release: push a tag like v1.2.3 and this workflow
#
#   1. runs the same tests as CI,
#   2. builds linux/amd64 and linux/arm64 and pushes ghcr.io/<owner>/umbral:1.2.3
#      (and :latest, unless the tag is a prerelease such as v1.2.0-rc.1),
#   3. tells the Caravana host to roll it out and waits for the rollout to be
#      healthy; the first time, it defines the app from deploy/caravana-app.json
#      (skipped for prereleases, and when the variable BELLA_BAXTER_PROJECT is
#      not set). The Caravana settings and tokens are read from Bella Baxter
#      with the job's GitHub OIDC token: no secret is stored in GitHub,
#   4. keeps the last 10 image versions and deletes older ones.
#
# Setup (Bella Baxter, variables, the production environment): README,
# "Deploying on Caravana".
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two tags pushed close together run one after the other, never at once: the
# prune of one must not race the push of the next. Nothing is cancelled, since
# a half-finished rollout is worse than a queued one.
concurrency: release

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR names are lowercase, and a GitHub owner can have capitals.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/umbral" >> "$GITHUB_OUTPUT"

      # The runtime stage has a RUN that executes under the target
      # architecture, so the arm64 image needs QEMU. The build stage does not:
      # the Dockerfile cross-publishes it natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.source (the repository) is among the labels
      # this sets. It is what links the package to the repository on GHCR.
      # `latest` only moves for a release: a tag with a "-" is a prerelease.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Tags:"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    # A prerelease is published but never deployed. The repository opts in to
    # deploying by setting the variable BELLA_BAXTER_PROJECT; without it (a
    # fork, say) this job is skipped.
    if: ${{ !contains(github.ref_name, '-') && vars.BELLA_BAXTER_PROJECT != '' }}
    runs-on: ubuntu-latest
    # The environment's deployment rule limits it to tags v*, and Bella
    # Baxter's trust domain requires this environment name in the token. Add
    # required reviewers to approve each rollout.
    environment: production
    permissions:
      contents: read
      id-token: write # the job's OIDC token, which Bella Baxter exchanges for a key
    env:
      BELLA_BAXTER_URL: https://api.bella-baxter.io
      BELLA_BAXTER_TENANT: ${{ vars.BELLA_BAXTER_TENANT }}
      BELLA_BAXTER_PROJECT: ${{ vars.BELLA_BAXTER_PROJECT }}
      BELLA_BAXTER_ENV: ${{ vars.BELLA_BAXTER_ENV || 'production' }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Only when the variable is set: an unset one must not become an empty
      # audience. The value goes in through env, never into the script text.
      - name: Bella Baxter audience
        if: ${{ vars.BELLA_OIDC_AUDIENCE != '' }}
        env:
          AUDIENCE: ${{ vars.BELLA_OIDC_AUDIENCE }}
        run: echo "BELLA_OIDC_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"

      # Signs in with the job's OIDC token (no stored secret) and leaves a
      # short-lived key for `bella run`.
      - uses: cosmic-chimps/bella-baxter-setup-action@3773cde54261a43a9a967fae67f2734259433674 # v0.1.1-preview.135
        with:
          version: 0.1.1-preview.135
          oidc: 'true'

      # The script is .github/scripts/caravana-deploy.sh. It calls the webhook;
      # the first time, when the app has no services yet, it defines the app
      # from deploy/caravana-app.json.
      # `bella run` puts every secret of the environment in the environment of
      # the command it runs, and nowhere else. It does not mask them, so the
      # two tokens are masked here before anything can print them. No -p or -e:
      # the project and environment come from the BELLA_BAXTER_* values above.
      # The names in Bella Baxter differ from the ones the script reads, hence
      # the three exports.
      - name: Roll out on Caravana
        run: |
          # shellcheck disable=SC2016 # the single quotes are on purpose: the inner shell expands
          bella run -- bash -c '
            for name in CARAVANA_API_TOKEN CARAVANA_WEBHOOK_TOKEN; do
              if [ -n "${!name:-}" ]; then echo "::add-mask::${!name}"; fi
            done
            export APP_ID="${CARAVANA_APP_ID:-umbral}" API_TOKEN="$CARAVANA_API_TOKEN" WEBHOOK_TOKEN="$CARAVANA_WEBHOOK_TOKEN"
            exec .github/scripts/caravana-deploy.sh'

  # Keep the last 10 versions. This waits for the rollout so that a failed one,
  # which Nomad reverts to the previous image, is never racing a deletion. It
  # also runs when the deploy was skipped (prerelease, or no Caravana), but not
  # when the deploy failed or was cancelled: then the old images stay until the
  # next good release.
  prune:
    needs: [image, deploy]
    if: ${{ always() && needs.image.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete old image versions
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "10"
        run: .github/scripts/prune-images.sh
