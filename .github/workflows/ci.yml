# Build and test, on both architectures a self-hoster runs Umbral on.
#
# The matrix is not decoration: SC-007 (idle resident set under 150 MB, or 160 MB
# with an external secret store) is asserted by
# tests/Umbral.Tests/IdleMemoryTests.fs on Linux only, and its margin was only
# ever measured on arm64. The x64 runner is where the number for an ordinary VPS
# comes from. Each job writes its figure to the job summary (the test appends it
# when GITHUB_STEP_SUMMARY is set), so it can be read off a run without opening
# a log.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same tests before it builds the image.
  workflow_call:

permissions:
  contents: read

jobs:
  # Documentation is the support channel (Principle VI), so a dead link is a
  # bug: every relative link in README.md and docs/**/*.md must reach a file,
  # and every #anchor a heading there. External URLs are not fetched. One run
  # is enough, so it is a job of its own rather than a step of the matrix.
  links:
    name: links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Links and anchors in the docs resolve
        run: .github/scripts/check-links.py

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Both pinned to Ubuntu 24.04, where the SC-007 budget was measured.
        # ubuntu-latest moved to 26.04, and one of its images (20261012.163)
        # reads the same build ~15 MiB higher at idle (154 against 150), so a
        # floating image failed unrelated changes. Move both together, on
        # purpose, after measuring the new image.
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The same check the Dockerfile runs: a view that gained a class without
      # the committed umbral.css being regenerated fails here, on the push,
      # instead of in the release's image build.
      - name: Stylesheet is up to date
        run: src/Umbral/Assets/build-css.sh --check

      # Released notes are never edited (a stale merge could still put text
      # inside a released section); this fails the push instead of the next
      # release (.github/scripts/changelog.sh, "released"). Compare with the
      # commit before this push, or with a PR's base. The release workflow
      # calls this file too; there the step is skipped.
      - name: Released changelog sections are unchanged
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No earlier commit to compare with."; exit 0
          fi
          case "$MESSAGE" in
            *"[edit released changelog]"*) echo "A released section may change: the commit or PR says so."; exit 0 ;;
          esac
          git fetch -q --depth=1 origin "$BASE"
          git show "$BASE:CHANGELOG.md" > "$RUNNER_TEMP/base-CHANGELOG.md"
          .github/scripts/changelog.sh released "$RUNNER_TEMP/base-CHANGELOG.md"

      # Notes live one file per change in changelog.d/, so a merge never touches
      # a shared section. This fails a push with a bad fragment or a
      # "## Unreleased" section (a branch started before that rule), and the
      # next step tests the script itself.
      - name: Release notes in changelog.d are well formed
        run: .github/scripts/changelog.sh check

      - name: Changelog script tests
        run: bash .github/scripts/changelog-test.sh

      # global.json pins the SDK (10.0.400, rolling forward to the latest
      # feature band) and the Microsoft.Testing.Platform runner.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Release, because that is what the container runs and what SC-007 is a
      # promise about; a Debug build is a few MiB bigger. Built once, then tested
      # without rebuilding, as the memory job below does with its own build.
      - name: Build
        run: dotnet build -c Release

      # Everything but the idle-memory measurements, which the `memory` job runs
      # on its own: a ceiling read on a busy runner never hides a failing test
      # here, and a failing test never hides a memory figure there.
      - name: Tests
        run: dotnet test -c Release --no-build --filter-not-class "Umbral.Tests.IdleMemoryTests"

  # The idle resident set (Principle II: SC-007 and the per-run ceilings in
  # tests/Umbral.Tests/IdleMemoryTests.fs), one job per architecture, so its
  # result has its own name in the checks and in a release run, as Bella Baxter
  # splits its test groups. A measurement depends on the runner as much as on
  # the code, so this job gates a pull request, where a regression is caught
  # before it merges, and only reports on a push to main and in a release
  # (continue-on-error): the figures and any breach are in the job summary and
  # in a warning on the run, and the task that owns the budget decides.
  memory:
    name: memory (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Idle resident set
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "### Idle resident set (SC-007)" >> "$GITHUB_STEP_SUMMARY"
          if ! dotnet test -c Release --no-build --filter-class "Umbral.Tests.IdleMemoryTests"; then
            echo "::warning title=Idle memory over a ceiling ($ARCH)::See the memory ($ARCH) job's summary for the figures. A gate on pull requests; a report on a push and in a release."
            exit 1
          fi

      # Not a gate: the same test again with tiered compilation back on (the .NET
      # default; Umbral.fsproj turns it off), to keep showing what the setting
      # saves on this architecture. The environment overrides runtimeconfig.json
      # and the app inherits it, so nothing in the test changes. Runs even after a
      # breach above, since that is when the comparison is most worth reading.
      - name: Idle memory with DOTNET_TieredCompilation=1 (comparison)
        if: always()
        # Its ceilings are the real runs', which tiered compilation is meant
        # to exceed: the numbers are the point, not the pass.
        continue-on-error: true
        env:
          DOTNET_TieredCompilation: "1"
        run: |
          echo "#### With DOTNET_TieredCompilation=1 (the old default)" >> "$GITHUB_STEP_SUMMARY"
          dotnet test -c Release --no-build --filter-class "Umbral.Tests.IdleMemoryTests"
